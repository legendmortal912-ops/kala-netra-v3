<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KALA-NETRA · Forensic Evidence Engine</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%232563EB' stroke-width='2.5'/><circle cx='16' cy='16' r='4.5' fill='%230D9488'/></svg>" />
  <link rel="stylesheet" href="./style.css?v=3.4" />
</head>

<body>
  <div class="aurora"></div>
  <div class="grid-bg"></div>

  <div id="boot" class="boot">
    <div class="boot-inner">
      <svg class="boot-eye" viewBox="0 0 120 120">
        <circle class="r1" cx="60" cy="60" r="46" />
        <circle class="r2" cx="60" cy="60" r="31" />
        <circle class="r3" cx="60" cy="60" r="12" />
      </svg>
      <div class="boot-title">KALA&#8209;NETRA</div>
      <div class="boot-sub">forensic correlation &amp; evidence engine</div>
      <div class="boot-bar"><i></i></div>
      <div class="boot-log" id="bootLog">binding to evidence ledger…</div>
    </div>
  </div>

  <aside class="rail" id="rail">
    <div class="brand">
      <div class="mark-wrap">
        <svg class="mark" viewBox="0 0 32 32">
          <circle cx="16" cy="16" r="13" />
          <circle cx="16" cy="16" r="4.6" class="pupil" />
        </svg>
      </div>
      <div>
        <div class="brand-name">KALA&#8209;NETRA</div>
        <div class="brand-ver">V3 · Evidence Engine</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="rail-foot">
      <div class="pill ok" id="railStatus"><i></i><span>engine ready</span></div>
      <button class="btn-ghost" id="btnPdf">Export §63(4)(c) dossier</button>
    </div>
  </aside>

  <div class="shell">
    <header class="topbar">
      <div class="tb-left">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Toggle navigation">
          <svg viewBox="0 0 24 24">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>
        <div style="min-width:0">
          <div class="tb-case" id="tbCase">—</div>
          <div class="tb-sub" id="tbSub">—</div>
        </div>
      </div>
      <div class="tb-right">
        <div class="tb-kpis" id="tbKpis"></div>
        <button class="icon-btn" id="themeBtn" title="Switch Blended Light / Aurora Slate theme">
          <svg id="themeIcon" viewBox="0 0 24 24">
            <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" />
          </svg>
          <span id="themeLabel">Slate</span>
        </button>
      </div>
    </header>

    <main id="main"></main>
  </div>

  <div class="drawer" id="drawer">
    <div class="drawer-head">
      <div>
        <div class="d-title" id="dTitle">Provenance</div>
        <div class="d-sub" id="dSub"></div>
      </div>
      <button class="x" id="dClose">✕</button>
    </div>
    <div class="drawer-body" id="dBody"></div>
  </div>
  <div class="scrim" id="scrim"></div>
  <div class="toast" id="toast"></div>

  <script src="./app.js?v=3.4"></script>
</body>

</html>
